<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 48"
     width="1440"
     height="48"
     preserveAspectRatio="none">

<defs>

<!-- Symmetric cyberpunk gradient (same color at 0% and 100%) so the scroll tiles
     seamlessly. Every stop cycles, so the neon color also flows along the rail. -->
<linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F4FF">
        <animate attributeName="stop-color" values="#00F4FF;#1AFFB2;#FFD400;#FF4A3D;#00F4FF" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="25%" stop-color="#1AFFB2">
        <animate attributeName="stop-color" values="#1AFFB2;#FFD400;#FF4A3D;#00F4FF;#1AFFB2" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#FFD400">
        <animate attributeName="stop-color" values="#FFD400;#FF4A3D;#00F4FF;#1AFFB2;#FFD400" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="75%" stop-color="#FF4A3D">
        <animate attributeName="stop-color" values="#FF4A3D;#00F4FF;#1AFFB2;#FFD400;#FF4A3D" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#00F4FF">
        <animate attributeName="stop-color" values="#00F4FF;#1AFFB2;#FFD400;#FF4A3D;#00F4FF" dur="8s" repeatCount="indefinite"/>
    </stop>
</linearGradient>

<!-- Bright band that sweeps along, reading as a signal running down the rail -->
<linearGradient id="cpPulse" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
    <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    <animate attributeName="x1" values="-400;1920" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2320"    dur="3.2s" repeatCount="indefinite"/>
</linearGradient>

<filter id="cpGlow" x="-10%" y="-200%" width="120%" height="500%">
    <feGaussianBlur stdDeviation="2"/>
    <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

<!-- Panel fill: symmetric cycling gradient so the color flows across the width,
     like the razor frames (0% and 100% match so it tiles seamlessly). -->
<linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#26000c">
        <animate attributeName="stop-color" values="#26000c;#180106;#2a2700;#0e211e;#26000c" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="25%" stop-color="#180106">
        <animate attributeName="stop-color" values="#180106;#2a2700;#0e211e;#26000c;#180106" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#2a2700">
        <animate attributeName="stop-color" values="#2a2700;#0e211e;#26000c;#180106;#2a2700" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="75%" stop-color="#0e211e">
        <animate attributeName="stop-color" values="#0e211e;#26000c;#180106;#2a2700;#0e211e" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#26000c">
        <animate attributeName="stop-color" values="#26000c;#180106;#2a2700;#0e211e;#26000c" dur="8s" repeatCount="indefinite"/>
    </stop>
</linearGradient>

<!-- The whole HUD panel, drawn once and tiled twice by the scroller below -->
<g id="art">

    <!-- PANEL (baseline closes flush at y=24; fill is a cycling gradient like the razor) -->
    <path fill="url(#panelGrad)" d="M0 0 H1920 V24 H1846 L1826 40 H1734 L1718 30 H1606 L1588 44 H1460 L1444 28 H1308 L1290 40 H1180 L1162 22 H1018 L992 46 H880 L860 28 H710 L690 40 H540 L522 30 H404 L386 44 H256 L236 24 H110 L92 38 L8 24 H0 Z"/>

    <!-- MAIN HUD RAIL (color cycles, glow breathes) -->
    <path fill="none" stroke="url(#cpGrad)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#cpGlow)"
          d="M0 23 H90 L110 15 H228 L246 31 H396 L416 20 H520 L540 34 H682 L702 22 H856 L880 40 H988 L1016 18 H1168 L1188 30 H1288 L1310 18 H1440 L1460 34 H1592 L1612 18 H1718 L1738 28 H1822 L1844 22 H1920">
        <animate attributeName="opacity" values="0.78;1;0.78" dur="2.6s" repeatCount="indefinite"/>
    </path>

    <!-- SIGNAL PULSE travelling along the rail -->
    <path fill="none" stroke="url(#cpPulse)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#cpGlow)"
          d="M0 23 H90 L110 15 H228 L246 31 H396 L416 20 H520 L540 34 H682 L702 22 H856 L880 40 H988 L1016 18 H1168 L1188 30 H1288 L1310 18 H1440 L1460 34 H1592 L1612 18 H1718 L1738 28 H1822 L1844 22 H1920"/>

    <!-- SECONDARY TRACE (static geometry, glows + breathes like the rail) -->
    <path fill="none" stroke="#00EFFF" stroke-width="1" filter="url(#cpGlow)"
          d="M0 15 H180 L192 8 H520 L540 16 H760 L780 8 H1120 L1140 16 H1480 L1500 8 H1900 L1920 15">
        <animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- LOWER TRACE (static geometry, glows + breathes like the rail) -->
    <path fill="none" stroke="#FFD800" stroke-width="1" filter="url(#cpGlow)"
          d="M0 31 H260 L278 25 H610 L628 31 H910 L928 25 H1242 L1260 31 H1540 L1558 25 H1900 L1920 31">
        <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <!-- vertical buses -->
    <g stroke="url(#cpGrad)" stroke-width="1">
        <path d="M188 15V44"/>
        <path d="M610 31V18"/>
        <path d="M924 25V46"/>
        <path d="M1280 18V40"/>
        <path d="M1718 18V38"/>
    </g>

    <!-- terminals (blink) -->
    <g fill="url(#cpGrad)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        <rect x="184" y="13" width="8" height="4"/>
        <rect x="606" y="29" width="8" height="4"/>
        <rect x="920" y="23" width="8" height="4"/>
        <rect x="1276" y="16" width="8" height="4"/>
        <rect x="1714" y="16" width="8" height="4"/>
    </g>

    <!-- cyan data blocks (flicker) -->
    <g fill="#00F4FF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.1s" repeatCount="indefinite"/>
        <rect x="70" y="10" width="12" height="2"/>
        <rect x="86" y="10" width="12" height="2"/>
        <rect x="102" y="10" width="12" height="2"/>
        <rect x="336" y="14" width="6" height="6"/>
        <rect x="348" y="14" width="6" height="6"/>
        <rect x="360" y="14" width="12" height="6"/>
        <rect x="740" y="9" width="12" height="2"/>
        <rect x="756" y="9" width="12" height="2"/>
        <rect x="772" y="9" width="12" height="2"/>
        <rect x="788" y="9" width="12" height="2"/>
        <rect x="1640" y="11" width="10" height="2"/>
        <rect x="1654" y="11" width="10" height="2"/>
        <rect x="1668" y="11" width="10" height="2"/>
        <rect x="1682" y="11" width="10" height="2"/>
    </g>

    <!-- vents -->
    <g stroke="#FFD400" stroke-width="1">
        <line x1="566" y1="10" x2="574" y2="18"/>
        <line x1="576" y1="10" x2="584" y2="18"/>
        <line x1="586" y1="10" x2="594" y2="18"/>
        <line x1="596" y1="10" x2="604" y2="18"/>
        <line x1="606" y1="10" x2="614" y2="18"/>
        <line x1="1048" y1="10" x2="1056" y2="18"/>
        <line x1="1058" y1="10" x2="1066" y2="18"/>
        <line x1="1068" y1="10" x2="1076" y2="18"/>
        <line x1="1078" y1="10" x2="1086" y2="18"/>
    </g>

    <!-- nodes (blink) -->
    <g fill="#FFD400">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
        <circle cx="480" cy="20" r="2"/>
        <circle cx="920" cy="25" r="2"/>
        <circle cx="1510" cy="19" r="2"/>
    </g>

    <!-- red triangles -->
    <g fill="#FF4A3D">
        <path d="M1546 16 L1554 16 L1550 8 Z"/>
        <path d="M312 16 L320 16 L316 8 Z"/>
    </g>

    <!-- micro PCB routing (static geometry, breathes) -->
    <g stroke="#00F4FF" stroke-width=".8" fill="none">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/>
        <path d="M402 20h18v6h22"/>
        <path d="M706 22h22v8h18"/>
        <path d="M1200 18h16v6h22"/>
        <path d="M1662 18h16v10h22"/>
    </g>

</g>

</defs>

<!-- Rotated 180 so it frames the bottom; the rotation makes the scroll run the
     opposite way, mirroring the top frame just like the razors. -->
<g transform="rotate(180 720 24)">
    <g>
        <use xlink:href="#art" href="#art"/>
        <use xlink:href="#art" href="#art" x="1920"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1920 0" dur="14s" repeatCount="indefinite"/>
    </g>
</g>

</svg>
