<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" preserveAspectRatio="none" role="img" aria-label="">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#FF3B30"/>
      <stop offset="1"    stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#dglow)">
    <rect x="0" y="11" width="1200" height="2" fill="url(#dg)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <polygon points="600,4 612,12 600,20 588,12" fill="#00F5FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
